name: build and publish enrichment vulnerability db

on:
  schedule:
    # Every day at midnight UTC.
    - cron: "0 0 * * *"
  workflow_dispatch: {}

# Serialize publishing runs so overlapping scheduled/manual runs cannot
# race and overwrite the mutable ":1" tag with an older feed snapshot.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  DB_REF: ghcr.io/${{ github.repository_owner }}/sbomscanner/sbomscannerdb:1

jobs:
  build:
    name: Build, sign and push the vulnerability DB
    runs-on: ubuntu-latest
    # Publishing must only happen from the default branch to prevent a manual
    # dispatch from an unreviewed branch overwriting and signing the production tag.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read # Checkout the repository
      packages: write # Push the DB artifact to ghcr.io
      id-token: write # Keyless signing with cosign
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the sbomscannerdb CLI
        run: make db-cli

      - name: Build the DB artifact
        run: ./bin/sbomscannerdb build "${DB_REF}"

      - name: Push the DB artifact
        id: push
        run: |
          set -euo pipefail
          # push prints: "pushed <ref> (<digest>)"
          output=$(./bin/sbomscannerdb push "${DB_REF}")
          echo "${output}"
          digest=$(echo "${output}" | sed -n 's/.*(\(sha256:[0-9a-f]\{64\}\)).*/\1/p')
          if [ -z "${digest}" ]; then
            echo "failed to parse pushed digest" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # We sign with both formats since cosign v3.x.x enables the new bundle
      # format by default, but some verification tools (e.g. slsactl, hauler and
      # old cosign) cannot verify signatures using this new format.
      - name: Sign the DB artifact with cosign v2 signature format (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          repo="${DB_REF%:*}"
          cosign sign --yes --new-bundle-format=false --use-signing-config=false \
            "${repo}@${DIGEST}"

      - name: Sign the DB artifact with cosign v3 signature format (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          repo="${DB_REF%:*}"
          cosign sign --yes --new-bundle-format=true --use-signing-config=true \
            "${repo}@${DIGEST}"
