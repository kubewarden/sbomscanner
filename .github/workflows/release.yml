name: Create a new release for SBOMscanner stack

# No default token permissions. Each job declares exactly what it needs.
permissions: {}

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    permissions:
      contents: read # Checkout the source
      packages: write # Pushing images to ghcr.io
      id-token: write # Signing images with cosign and actions/attest
      attestations: write # actions/attest (SLSA L3 provenance)
    uses: kubewarden/github-actions/.github/workflows/container-release.yml@4d25ea5d35d22768786526f592b0f9ba27587c9c # v8.0.0
    with:
      components: '["controller","worker","storage","mcp"]'
      image-namespace: sbomscanner
      version: ${{ github.ref_name }}
      artifact-prefix: SBOMscanner-
  create-release:
    needs: [build]
    permissions:
      contents: write # Creating a release
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve tag name
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "TAG_NAME=${REF_NAME}" >> "$GITHUB_ENV"
      - name: Get release ID from the release created by release drafter
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            let releases = await github.rest.repos.listReleases({
                owner: context.repo.owner,
                repo: context.repo.repo,
            });
            for (const release of releases.data) {
              if (release.draft) {
                      core.info(release)
                      core.exportVariable('RELEASE_ID', release.id)
                      return
              }
            }
            core.setFailed(`Draft release not found`)
      - name: Download attestation artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: attestation-SBOMscanner-*
          merge-multiple: true
      - name: Display structure of downloaded files
        run: ls -R

      - name: Upload release assets
        id: upload_release_assets
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            let fs = require('fs');
            let path = require('path');
            let files = [
                'SBOMscanner-controller-attestation-amd64-provenance.intoto.jsonl',
                'SBOMscanner-controller-attestation-amd64-provenance.intoto.jsonl.bundle.sigstore',
                'SBOMscanner-controller-attestation-arm64-provenance.intoto.jsonl',
                'SBOMscanner-controller-attestation-arm64-provenance.intoto.jsonl.bundle.sigstore',
                'SBOMscanner-controller-attestation-amd64-sbom.json',
                'SBOMscanner-controller-attestation-amd64-sbom.json.bundle.sigstore',
                'SBOMscanner-controller-attestation-arm64-sbom.json',
                'SBOMscanner-controller-attestation-arm64-sbom.json.bundle.sigstore',

                'SBOMscanner-worker-attestation-amd64-provenance.intoto.jsonl',
                'SBOMscanner-worker-attestation-amd64-provenance.intoto.jsonl.bundle.sigstore',
                'SBOMscanner-worker-attestation-arm64-provenance.intoto.jsonl',
                'SBOMscanner-worker-attestation-arm64-provenance.intoto.jsonl.bundle.sigstore',
                'SBOMscanner-worker-attestation-amd64-sbom.json',
                'SBOMscanner-worker-attestation-amd64-sbom.json.bundle.sigstore',
                'SBOMscanner-worker-attestation-arm64-sbom.json',
                'SBOMscanner-worker-attestation-arm64-sbom.json.bundle.sigstore',

                'SBOMscanner-storage-attestation-amd64-provenance.intoto.jsonl',
                'SBOMscanner-storage-attestation-amd64-provenance.intoto.jsonl.bundle.sigstore',
                'SBOMscanner-storage-attestation-arm64-provenance.intoto.jsonl',
                'SBOMscanner-storage-attestation-arm64-provenance.intoto.jsonl.bundle.sigstore',
                'SBOMscanner-storage-attestation-amd64-sbom.json',
                'SBOMscanner-storage-attestation-amd64-sbom.json.bundle.sigstore',
                'SBOMscanner-storage-attestation-arm64-sbom.json',
                'SBOMscanner-storage-attestation-arm64-sbom.json.bundle.sigstore',

                'SBOMscanner-mcp-attestation-amd64-provenance.intoto.jsonl',
                'SBOMscanner-mcp-attestation-amd64-provenance.intoto.jsonl.bundle.sigstore',
                'SBOMscanner-mcp-attestation-arm64-provenance.intoto.jsonl',
                'SBOMscanner-mcp-attestation-arm64-provenance.intoto.jsonl.bundle.sigstore',
                'SBOMscanner-mcp-attestation-amd64-sbom.json',
                'SBOMscanner-mcp-attestation-amd64-sbom.json.bundle.sigstore',
                'SBOMscanner-mcp-attestation-arm64-sbom.json',
                'SBOMscanner-mcp-attestation-arm64-sbom.json.bundle.sigstore',
                ]
            const {RELEASE_ID} = process.env
            for (const file of files) {
              let file_data = fs.readFileSync(file);
              let response = await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: `${RELEASE_ID}`,
                name: path.basename(file),
                data: file_data,
              });
            }
      - name: Publish release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const {RELEASE_ID} = process.env
            const {TAG_NAME} = process.env
            isPreRelease = ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: `${RELEASE_ID}`,
              draft: false,
              tag_name: `${TAG_NAME}`,
              name: `SBOMscanner ${TAG_NAME}`,
              prerelease: isPreRelease,
              make_latest: !isPreRelease
            });

  update-charts:
    needs: [create-release]
    uses: $/.github/workflows/update-charts.yml
    permissions:
      contents: write # for updatecli to update the repository
      pull-requests: write # for updatecli to create a PR
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      APP_INSTALLATION_ID: ${{ secrets.APP_INSTALLATION_ID }}
