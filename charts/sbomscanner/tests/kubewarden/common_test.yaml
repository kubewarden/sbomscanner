suite: "Values contract: common"
templates:
  - "templates/controller/deployment.yaml"
  - "templates/storage/deployment.yaml"
  - "templates/worker/deployment.yaml"
  - "templates/worker/daemonset.yaml"
  - "templates/mcp/deployment.yaml"
set:
  mcp:
    enabled: true
    auth:
      secretName: x
tests:
  - it: "should render common.imageRegistry on every workload, before the Rancher registry"
    set:
      global:
        cattle:
          systemDefaultRegistry: rancher.example.com
      common:
        imageRegistry: mirror.example.com
    asserts:
      - matchRegex:
          path: "spec.template.spec.containers[0].image"
          pattern: "^mirror\\.example\\.com/kubewarden/sbomscanner/"

  - it: "should render common.logLevel on every workload"
    set:
      common:
        logLevel: warn
    asserts:
      - contains:
          path: "spec.template.spec.containers[0].args"
          content: "-log-level=warn"

  - it: "should render common.tolerations on every workload"
    set:
      common:
        tolerations:
          - operator: Exists
    asserts:
      - equal:
          path: "spec.template.spec.tolerations"
          value:
            - operator: Exists

  - it: "should render common.nodeSelector on every workload"
    set:
      common:
        nodeSelector:
          kubernetes.io/os: linux
    asserts:
      - equal:
          path: "spec.template.spec.nodeSelector"
          value:
            kubernetes.io/os: linux

  - it: "should render common.extraEnv on every workload"
    set:
      common:
        extraEnv:
          - name: FROM_COMMON
            value: "yes"
    asserts:
      - contains:
          path: "spec.template.spec.containers[0].env"
          content:
            name: FROM_COMMON
            value: "yes"
